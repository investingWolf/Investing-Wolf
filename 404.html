<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Investing Wolf</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C96A;
  --black: #060606;
  --white: #F2EDE4;
  --white-dim: #7A7268;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--white);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
.wrap{max-width:480px;}
.code{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,15vw,7rem);color:var(--gold);font-weight:300;line-height:1;}
h1{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;margin:16px 0 12px;}
p{color:var(--white-dim);font-size:0.9rem;margin-bottom:32px;line-height:1.6;}
a{display:inline-block;padding:12px 32px;background:var(--gold);color:var(--black);text-decoration:none;font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;transition:background 0.25s;}
a:hover{background:var(--gold-light);}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="/">Return to Homepage</a>
</div>
</body>
</html>
